[package]
name = "ssh-thing-cli"
version.workspace = true
edition.workspace = true
description = "LLM-facing CLI for SSH THING: run saved, server-scoped snippets only"
publish = false

[[bin]]
name = "ssh-thing"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-thing-core = { path = "../ssh-thing-core" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
